<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encontre a unidade mais próxima</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="pagina">
    <header class="busca">
      <p class="busca__eyebrow">Localizador de unidades</p>
      <h1 class="busca__titulo">Qual unidade fica mais perto de você?</h1>

      <form id="form-busca" class="busca__form" autocomplete="off">
        <label for="cep" class="sr-only">CEP</label>
        <input
          type="text"
          id="cep"
          name="cep"
          class="busca__input"
          placeholder="Digite seu CEP"
          inputmode="numeric"
          maxlength="9"
        />
        <button type="submit" class="busca__botao">
          <span>Buscar</span>
        </button>
      </form>
      <p id="mensagem-erro" class="busca__erro" hidden></p>
    </header>

    <section id="resultados-secao" class="resultados" hidden>
      <h2 class="resultados__titulo">
        <span class="resultados__icone">📍</span>
        Unidades próximas de <span id="resultados-cep-ref"></span>
      </h2>
      <div id="lista-resultados" class="resultados__lista"></div>
    </section>

    <section id="estado-vazio" class="estado-vazio" hidden>
      <p>Nenhuma unidade encontrada perto desse CEP ainda.</p>
    </section>

    <div id="carregando" class="carregando" hidden>
      <div class="carregando__spinner" aria-hidden="true"></div>
      <p>Calculando as unidades mais próximas…</p>
    </div>
  </main>

  <template id="template-card">
    <article class="card">
      <img class="card__logo" alt="" />
      <div class="card__info">
        <h3 class="card__nome"></h3>
        <p class="card__endereco"></p>
        <p class="card__trajeto">
          <span class="card__trajeto-icone">🚗</span>
          <span class="card__distancia"></span> ·
          <span class="card__tempo"></span>
        </p>
        <a class="card__cta" target="_blank" rel="noopener">Como chegar</a>
      </div>
    </article>
  </template>

  <script src="/js/app.js"></script>
</body>
</html>
